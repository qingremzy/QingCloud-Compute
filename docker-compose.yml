services:
  qingcloud:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QCLOUD_DB_PATH: /data/qingcloud.sqlite3
    ports:
      # Keep the API private to this host. Put an HTTPS reverse proxy in front
      # before remote workers or YTAgent connect.
      - "127.0.0.1:8000:8000"
    volumes:
      - qingcloud-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qingcloud-data:
